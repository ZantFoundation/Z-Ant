name: 'Setup Zig Version'
description: 'Standardized Zig setup using goto-bus-stop'
inputs:
  version:
    description: 'The Zig version to install'
    required: false
    default: '0.15.2'

runs:
  using: "composite"
  steps:
    - name: Set up Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: ${{ inputs.version }}