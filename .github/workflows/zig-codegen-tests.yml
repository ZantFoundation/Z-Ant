name: Zig Codegen Tests

on:
  push:
    branches: [feat/ci-cd]
  workflow_dispatch:

jobs:
  setup-models:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Zig
        uses: ./.github/actions/setup-zig

      - name: Set up Python
        uses: ./.github/actions/setup-python
      
      - name: Generate ONNX test models
        run: ./zant onnx_gen
      
      - name: Upload generated models
        uses: actions/upload-artifact@v4
        with:
          name: onnx-models
          path: datasets/oneOpModels/
          retention-days: 1


  test-oneop:
    name: Run oneop tests
    runs-on: ubuntu-latest
    needs: setup-models
    strategy:
      matrix:
        operation: [Add, Conv, MatMul, Relu, Softmax, all]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download generated models
        uses: actions/download-artifact@v4
        with:
          name: onnx-models
          path: datasets/oneOpModels/

      - name: Set up Zig
        uses: ./.github/actions/setup-zig

      - name: Generate OneOp codegen for ${{ matrix.operation }}
        run: zig build op-codegen-gen -Dop=${{ matrix.operation }}

      - name: Test OneOp codegen for ${{ matrix.operation }}
        run: zig build op-codegen-test -Dop=${{ matrix.operation }} --summary all


  test-lib-generation:
    name: Run library generation tests
    runs-on: ubuntu-latest
    needs: setup-models
    strategy:
      matrix:
        model: [mnist-8]
        comm: [true, false]
        enable_user_tests: [true, false]
        dynamic: ["", "-Ddynamic"]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Zig
        uses: ./.github/actions/setup-zig
      
      - name: Set up Python
        uses: ./.github/actions/setup-python
      
      - name: Generate test data for ${{ matrix.model }}
        run: ./zant user_tests_gen --model ${{ matrix.model }}
      
      - name: Generate library code for ${{ matrix.model }}
        run: zig build lib-gen -Dmodel=${{ matrix.model }} -Denable_user_tests=${{ matrix.enable_user_tests }} -Dcomm=${{ matrix.comm }} ${{ matrix.dynamic }}

      - name: Test generated library for ${{ matrix.model }}
        run: zig build lib-test -Dmodel=${{ matrix.model }} -Denable_user_tests=${{ matrix.enable_user_tests }} -Dcomm=${{ matrix.comm }} ${{ matrix.dynamic }} --summary all
      
      - name: Build static library for ${{ matrix.model }}
        run: zig build lib -Dmodel=${{ matrix.model }} -Denable_user_tests=${{ matrix.enable_user_tests }} -Dcomm=${{ matrix.comm }} ${{ matrix.dynamic }} --summary all


  test-extractor:
    runs-on: ubuntu-latest
    needs: setup-models
    strategy:
      matrix:
        model: [mnist-8]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download generated models
        uses: actions/download-artifact@v4
        with:
          name: onnx-models
          path: datasets/oneop_models

      - name: Set up Python
        uses: ./.github/actions/setup-python

      - name: Set up Zig
        uses: ./.github/actions/setup-zig

      - name: Extract nodes from ${{ matrix.model }}
        run: ./zant onnx_extract --model ${{ matrix.model }}

      - name: Generate extractor tests for ${{ matrix.model }}
        run: zig build extractor-gen -Dmodel=${{ matrix.model }}

      - name: Run extractor tests for ${{ matrix.model }}
        run: zig build extractor-test -Dmodel=${{ matrix.model }} --summary all
